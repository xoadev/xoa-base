# Same wait as the rule for every dependency: nothing younger than a week. A project takes the new versions when it
# moves to a release of this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker
    directories:
      - /test/image
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
