# Every pull request and push to main: the checks run over the test site and image through the same reusable
# workflows a project calls. A public repository: GitHub's runners only, never a self-hosted one a fork's pull request
# could run on.
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    uses: ./.github/workflows/title.yml

  lint:
    # Editing the description re-runs the workflow for the title only.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - run: make lint test-image-policy test-fetch

  web:
    # Editing the description re-runs the workflow for the title only.
    if: github.event.action != 'edited'
    uses: ./.github/workflows/web.yml
    with:
      directory: test/site
      target: test-web

  image:
    # Editing the description re-runs the workflow for the title only.
    if: github.event.action != 'edited'
    uses: ./.github/workflows/image.yml
    with:
      target: test-image
