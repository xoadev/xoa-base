# The draft release of the next version, rewritten on every push to main: convco reads the Conventional Commits since
# the last published tag and says the version and what went in. It publishes nothing and makes no tag; release.yml
# publishes the draft. This repository runs it on its own pushes, and a project calls it by SHA:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     draft:
#       permissions:
#         contents: write
#       uses: xoadev/xoa-base/.github/workflows/release-draft.yml@<sha> # vX.Y.Z
name: release-draft

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      paths:
        description: What goes into a release, comma-separated; commits touching only other paths release nothing
        type: string
        default: .
      tag-prefix:
        description: The tag's prefix, v by default, <name>-v for a repository that releases several things
        type: string
        default: v
      title:
        description: What the release is called, before its version (empty, its tag alone)
        type: string
        default: ""
      latest:
        description: The release may become the repository's latest (false for one of several things it releases)
        type: boolean
        default: true

permissions:
  contents: read

# One at a time and never cancelled: a push while the draft is written would move it under the writer.
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag-prefix || 'v' }}
  cancel-in-progress: false

jobs:
  # convco runs with a token that can write nothing.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.next-version-tag }}
      version: ${{ steps.version.outputs.next-version }}
      has-changes: ${{ steps.version.outputs.has-changes }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # convco reads every commit since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Next version and changes
        id: version
        uses: xoadev/convco-version@e8cf4f03b64bbbb8b2e10cecdab9c99ada457e9c # v1.1.0
        with:
          paths: ${{ inputs.paths || '.' }}
          tag-prefix: ${{ inputs.tag-prefix || 'v' }}

  # One draft, always the next version's: a feat after a fix turns 0.1.1 into 0.2.0, and the draft of 0.1.1 would
  # otherwise announce a version that will never exist. Only gh, no checkout.
  draft:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # rewrite the draft release
    steps:
      - name: Rewrite the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ inputs.tag-prefix || 'v' }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          HAS_CHANGES: ${{ needs.version.outputs.has-changes }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          TITLE: ${{ inputs.title }}
          LATEST: ${{ inputs.latest != false }}
        run: |
          if [[ "$HAS_CHANGES" == true && "$TAG" != "$PREFIX$VERSION" ]] ||
            ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::convco said '$TAG' ($VERSION), not $PREFIX<X.Y.Z>" >&2
            exit 1
          fi
          # Only this prefix's drafts: a repository that releases several things has one draft per prefix.
          gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.isDraft and (.tagName | startswith(\"$PREFIX\"))) | .tagName" |
            while read -r stale; do
              [[ "$stale" == "$TAG" && "$HAS_CHANGES" == true ]] || gh release delete "$stale" --yes
            done
          if [[ "$HAS_CHANGES" != true ]]; then
            echo "draft: nothing to release"
            exit 0
          fi
          # A published release is never turned back into a draft.
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo none)" in
            true) gh release edit "$TAG" --draft --target "$GITHUB_SHA" --notes "$CHANGELOG" ;;
            none)
              title=$TAG
              if [[ -n "$TITLE" ]]; then title="$TITLE $VERSION"; fi
              gh release create "$TAG" --draft --latest="$LATEST" --target "$GITHUB_SHA" \
                --title "$title" --notes "$CHANGELOG"
              ;;
            *)
              echo "::error title=Published::$TAG is already published; the next change must bump the version" >&2
              exit 1
              ;;
          esac
          echo "draft: $TAG"
