# The container image's checks for both architectures, called from a project's workflow by SHA:
#
#   jobs:
#     image:
#       uses: xoadev/xoa-base/.github/workflows/image.yml@<sha> # vX.Y.Z
#
# It runs the project's own `make image-lint image-check`, whose Makefile fetches container/ from this repository at
# its XOA_BASE, which is to be the same commit. Publishing the image is the project's release workflow, which takes
# the archive of `make image-oci`.
name: image

on:
  workflow_call:
    inputs:
      target:
        description: The make targets that check it
        type: string
        default: image-lint image-check
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      runs-on:
        description: >-
          The runner, as JSON (a label, or a list of labels). Empty: a private repository runs on its organization's
          own runners, the JSON labels in its Actions variable SELF_HOSTED_DOCKER_RUNNER, or else SELF_HOSTED_RUNNER, with Docker, and anything else on GitHub's, since a
          public repository's pull requests come from anyone.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on != '' && fromJSON(inputs.runs-on) || (github.event.repository.private && (vars.SELF_HOSTED_DOCKER_RUNNER || vars.SELF_HOSTED_RUNNER) && fromJSON(vars.SELF_HOSTED_DOCKER_RUNNER || vars.SELF_HOSTED_RUNNER) || 'ubuntu-latest') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated only to start the image and check it; it is never compiled under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check
        env:
          TARGET: ${{ inputs.target }}
          PLATFORMS: ${{ inputs.platforms }}
        # TARGET is a list of targets.
        run: |
          read -ra targets <<< "$TARGET"
          make "${targets[@]}" PLATFORMS="$PLATFORMS"
