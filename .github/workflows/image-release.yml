# Publishes a project's container image for a version, both architectures under one tag, provenance attached: a
# public repository's index is attested by GitHub, a private one's signed keyless with cosign (GitHub's attestations
# need a public repository on XOA's plan; the signature goes to Sigstore's public log with the repository's name, the
# workflow and the commit). A published tag is never rewritten. A project calls it when its release is published:
#
#   on:
#     release:
#       types: [published]
#   jobs:
#     image:
#       permissions:
#         contents: read
#         packages: write # push to ghcr.io
#         id-token: write # sign or attest, keyless
#         attestations: write # store a public repository's attestation
#       uses: xoadev/xoa-base/.github/workflows/image-release.yml@<sha> # vX.Y.Z
#       with:
#         version: ${{ github.event.release.tag_name }}
name: image-release

on:
  workflow_call:
    inputs:
      version:
        description: The tag to publish, vX.Y.Z; the image's tag drops the v
        type: string
        required: true
      image:
        description: Where to publish it (default ghcr.io/<owner>/<repository>)
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      runs-on:
        description: The build's runner, as JSON; empty picks as image.yml does
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The project's own make, at the release's commit, with a token that only reads: the compiler and the tests never
  # hold one that writes. It checks the image and builds every platform into one OCI archive.
  build:
    runs-on: >-
      ${{ inputs.runs-on != '' && fromJSON(inputs.runs-on)
        || (github.event.repository.private && (vars.SELF_HOSTED_DOCKER_RUNNER || vars.SELF_HOSTED_RUNNER)
          && fromJSON(vars.SELF_HOSTED_DOCKER_RUNNER || vars.SELF_HOSTED_RUNNER) || 'ubuntu-latest') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check and build
        env:
          PLATFORMS: ${{ inputs.platforms }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::'$VERSION' is not vX.Y.Z" >&2
            exit 1
          fi
          make image-check PLATFORMS="$PLATFORMS"
          make image-oci OCI="$RUNNER_TEMP/image.tar" PLATFORMS="$PLATFORMS" \
            IMAGE_BUILD_ARGS="--build-arg VERSION=${VERSION#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Only skopeo and the signing tool, on what build made: nothing is compiled or run here while the token can write.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign or attest, keyless
      attestations: write # store a public repository's attestation
    outputs:
      image: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ inputs.version }}
          path: ${{ runner.temp }}

      - name: Push the index, unless the tag exists
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_INPUT: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          image=${IMAGE_INPUT:-ghcr.io/${GITHUB_REPOSITORY,,}}
          tag="$image:${VERSION#v}"
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          # A tag is published once: "manifest unknown" is the registry saying it does not exist yet, and any other
          # failure stops here rather than risk rewriting it.
          if error=$(skopeo inspect --raw "docker://$tag" 2>&1 > /dev/null); then
            echo "::error title=Published::$tag already exists, and a published tag is never rewritten" >&2
            exit 1
          fi
          case "$error" in
            *"manifest unknown"* | *"not found"*) ;;
            *) echo "::error::cannot tell whether $tag exists: $error" >&2; exit 1 ;;
          esac
          skopeo copy --all --quiet --digestfile "$RUNNER_TEMP/digest" \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$tag"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
          echo "published $tag@$(cat "$RUNNER_TEMP/digest")"

      - name: Attest the index (public repository)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign (private repository)
        if: ${{ github.event.repository.private }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Sign the index and each platform (private repository)
        if: ${{ github.event.repository.private }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign sign --yes --recursive "$IMAGE"
