# The linters of lint/*.mk on a runner that does not bring them: GitHub's, where a public repository runs. XOA's own
# runners and agents have them in their image (by-fros/cloud). Called by SHA, after actions/setup-go's Go:
#
#   - uses: xoadev/xoa-base/.github/actions/linters@<sha> # vX.Y.Z
#
# Go checks each module against go.sum's database, typos' archive is checked against its sha256, and pip installs
# lint/requirements.txt only with the hashes it lists. shellcheck is already on GitHub's runners. Each step adds to
# GITHUB_PATH a folder of the runner's own, never a value from the event: zizmor's github-env is ignored there.
name: XOA linters
description: Install the linters xoa-base's lint/*.mk need, at pinned versions

runs:
  using: composite
  steps:
    - name: actionlint, shfmt and editorconfig-checker
      shell: bash
      run: | # zizmor: ignore[github-env]
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        go install github.com/editorconfig-checker/editorconfig-checker/v4/cmd/editorconfig-checker@v4.0.2
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: typos
      shell: bash
      run: | # zizmor: ignore[github-env]
        curl -fsSL --proto '=https' -o "$RUNNER_TEMP/typos.tgz" \
          https://github.com/crate-ci/typos/releases/download/v1.52.2/typos-v1.52.2-x86_64-unknown-linux-musl.tar.gz
        sha256=3b13d1291281d39d01822e54035636487a7a0f228e70097899b1e33aeb0e7e93
        echo "$sha256  $RUNNER_TEMP/typos.tgz" | sha256sum -c --quiet
        mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/typos.tgz" -C "$RUNNER_TEMP/bin" ./typos
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: yamllint and zizmor
      shell: bash
      env:
        REQUIREMENTS: ${{ github.action_path }}/../../../lint/requirements.txt
      run: | # zizmor: ignore[github-env]
        python3 -m venv "$RUNNER_TEMP/linters"
        "$RUNNER_TEMP/linters/bin/pip" install --quiet --require-hashes --only-binary :all: -r "$REQUIREMENTS"
        echo "$RUNNER_TEMP/linters/bin" >> "$GITHUB_PATH"
